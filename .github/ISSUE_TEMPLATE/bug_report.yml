name: Bug report
description: Report a reproducible Jupydex defect with sanitized details.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Remove tokens, cookies, real endpoints,
        usernames, filesystem paths, and unreviewed terminal output.
  - type: input
    id: version
    attributes:
      label: Jupydex version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.13.5"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system
      placeholder: "macOS 15, Ubuntu 24.04, WSL2"
    validations:
      required: true
  - type: input
    id: jupyter
    attributes:
      label: Jupyter Server or JupyterLab version
      placeholder: "Jupyter Server 2.x"
  - type: dropdown
    id: auth
    attributes:
      label: Authentication type
      options:
        - Token
        - Cookie
        - None
        - Unknown
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Use synthetic endpoints and credentials.
      placeholder: |
        1. Configure a synthetic server URL
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized JSON
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed all live credentials and private infrastructure details.
          required: true
        - label: This is not a confidential security report.
          required: true
