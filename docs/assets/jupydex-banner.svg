<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Jupydex</title>
  <desc id="desc">A direct terminal bridge from coding agents to JupyterLab</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.5" stop-color="#17133f"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <circle cx="1020" cy="32" r="210" fill="#22d3ee" opacity="0.08"/>
  <circle cx="104" cy="338" r="230" fill="#8b5cf6" opacity="0.1"/>
  <path d="M0 286 C260 222 370 360 650 286 S1010 236 1200 292" fill="none" stroke="#fff" stroke-opacity="0.05" stroke-width="2"/>

  <g transform="translate(82 72)">
    <circle cx="106" cy="106" r="104" fill="#8b5cf6" opacity="0.2" filter="url(#glow)"/>
    <rect x="10" y="28" width="192" height="150" rx="20" fill="#111827" stroke="url(#accent)" stroke-width="4"/>
    <rect x="10" y="28" width="192" height="32" rx="20" fill="#1f2937"/>
    <path d="M10 60h192" stroke="#374151" stroke-width="2"/>
    <circle cx="34" cy="44" r="5" fill="#fb7185"/>
    <circle cx="52" cy="44" r="5" fill="#fbbf24"/>
    <circle cx="70" cy="44" r="5" fill="#34d399"/>
    <path d="M48 95l24 18-24 18" fill="none" stroke="#a78bfa" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M88 135h48" stroke="#67e8f9" stroke-width="8" stroke-linecap="round"/>
    <path d="M202 104 C246 104 246 190 290 190" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="294" cy="190" r="10" fill="#22d3ee"/>
  </g>

  <g transform="translate(430 74)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="0" y="70" fill="#f8fafc" font-size="72" font-weight="750" letter-spacing="2">Jupydex</text>
    <rect x="2" y="91" width="490" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="0" y="140" fill="#cbd5e1" font-size="24">Direct JupyterLab terminals for coding agents.</text>
    <text x="0" y="180" fill="#94a3b8" font-size="18">REST for session control · WebSocket for terminal I/O · JSON for automation</text>

    <g transform="translate(0 218)" font-size="15" font-weight="650">
      <g>
        <rect width="108" height="38" rx="19" fill="#8b5cf6" opacity="0.18" stroke="#a78bfa" stroke-opacity="0.55"/>
        <text x="54" y="25" text-anchor="middle" fill="#ddd6fe">No browser</text>
      </g>
      <g transform="translate(122)">
        <rect width="104" height="38" rx="19" fill="#22d3ee" opacity="0.14" stroke="#67e8f9" stroke-opacity="0.5"/>
        <text x="52" y="25" text-anchor="middle" fill="#cffafe">Scriptable</text>
      </g>
      <g transform="translate(240)">
        <rect width="122" height="38" rx="19" fill="#34d399" opacity="0.13" stroke="#6ee7b7" stroke-opacity="0.48"/>
        <text x="61" y="25" text-anchor="middle" fill="#d1fae5">Reconnectable</text>
      </g>
      <g transform="translate(376)">
        <rect width="136" height="38" rx="19" fill="#fbbf24" opacity="0.12" stroke="#fde68a" stroke-opacity="0.45"/>
        <text x="68" y="25" text-anchor="middle" fill="#fef3c7">Privacy-first</text>
      </g>
    </g>
  </g>
</svg>
