[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jupydex"
version = "0.3.0"
description = "A small, scriptable JupyterLab terminal gateway for coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Cambridger"},
]
keywords = ["jupyter", "jupyterlab", "terminal", "automation", "coding-agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "httpx>=0.27",
  "websockets>=14",
]

[project.urls]
Homepage = "https://github.com/Cambridger/jupydex"
Documentation = "https://github.com/Cambridger/jupydex#readme"
Issues = "https://github.com/Cambridger/jupydex/issues"
Changelog = "https://github.com/Cambridger/jupydex/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "build>=1.2",
]

[project.scripts]
jdx = "jupydex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
